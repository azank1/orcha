# Docker Compose for Metaorcha Local Development
# Infra-only: postgres, redis, kafka, registry, planning-discovery, localstack (S3).
# Run superagent and gateway locally with `make sa-dev` / `make gw-dev`.
# After LocalStack is up: `make s3-init` (creates emerge-artifacts-local on localhost:4566).

services:
  # ============================================================================
  # PostgreSQL Database (Supabase-compatible)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg15
    container_name: metaorcha-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metaorcha
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metaorcha-network

  # ============================================================================
  # Registry Service
  # ============================================================================
  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    container_name: metaorcha-registry
    environment:
      # Service
      SERVICE_NAME: registry-service
      SERVICE_VERSION: 1.0.0
      ENVIRONMENT: development

      # Server
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: "false"

      # gRPC
      GRPC_HOST: "[::]"
      GRPC_PORT: 50051

      # Database
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/metaorcha?schema=public

      # Security — internal Registry; Gateway owns user auth (matches docker-compose.dev)
      DISABLE_AUTH: "true"
      PAT_TOKEN_PREFIX: metaorcha_pat_
      PAT_TOKEN_LENGTH: 40

      # Adapter Settings
      ADAPTER_TIMEOUT: 10
      ADAPTER_MAX_RETRIES: 3
      ADAPTER_BASE_DELAY: 1.0

      # Health Check
      HEALTH_CHECK_INTERVAL: 300
      MAX_HEALTH_FAILURES: 3

      # Payment
      PAYMENT_FACILITATOR_URL: https://api.metaorcha.bot/verify

      # MCP Protocol
      MCP_PROTOCOL_VERSION: "2025-11-25"

      # Kafka (emit registry.agent.registered on successful registration)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"  # REST API
      - "50051:50051"  # gRPC
    depends_on:
      postgres:
        condition: service_healthy
      metaorcha-kafka:
        condition: service_healthy
    networks:
      - metaorcha-network
    volumes:
      - ./services/registry/src:/app/services/registry/src
      - ./common:/app/common
    command: >
      sh -c "
        cd /app/common/database &&
        uv run prisma migrate deploy &&
        cd /app &&
        python -m uvicorn services.registry.src.main:app
          --host 0.0.0.0
          --port 8000
          --reload
      "

  # ============================================================================
  # Kafka Broker (KRaft mode — no Zookeeper)
  # Advertises localhost:9092 so host-side services can connect directly.
  # ============================================================================
  metaorcha-kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: metaorcha-kafka
    hostname: kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      KAFKA_CFG_LOG_SEGMENT_BYTES: 1073741824
      # Fixed cluster ID (base64url, 22 chars) prevents re-format mismatch on container restart
      KAFKA_KRAFT_CLUSTER_ID: "CWwkRs5ZQk-Zv0iQRweAmw"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - metaorcha-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================================
  # Planning & Discovery Service
  # ============================================================================
  planning-discovery:
    build:
      context: .
      dockerfile: services/planning-discovery/Dockerfile
    container_name: metaorcha-planning-discovery
    environment:
      # Service
      SERVICE_NAME: planning-discovery-service
      SERVICE_VERSION: 1.0.0
      ENVIRONMENT: development

      # Server
      HOST: 0.0.0.0
      PORT: 8001

      # Database
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/metaorcha?schema=public

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_MANIFEST_GROUP_ID: planning-manifest-processors

      # LLM
      LLM_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_DECOMPOSITION_MODEL: meta-llama/llama-3.1-8b-instruct
      LLM_FALLBACK_MODEL: openai/gpt-4o
      LLM_EMBEDDING_MODEL: openai/text-embedding-3-small
      LLM_VALIDATION_MODEL: openai/gpt-4o-mini
      LLM_CONFIDENCE_THRESHOLD: "0.75"

      # Search
      TOP_K_CANDIDATES: "5"
      SIMILARITY_THRESHOLD: "0.75"

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      metaorcha-kafka:
        condition: service_healthy
    networks:
      - metaorcha-network
    volumes:
      - ./services/planning-discovery/src:/app/services/planning-discovery/src
      - ./common:/app/common
    command: >
      sh -c "
        python -m uvicorn services.planning-discovery.src.main:app
          --host 0.0.0.0
          --port 8001
          --reload
      "

  # ============================================================================
  # pgAdmin (Optional - Database Management UI)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: metaorcha-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@metaorcha.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - metaorcha-network
    profiles:
      - tools

  # ============================================================================
  # Redis Stack (SuperAgent session state & RediSearch checkpointing)
  # ============================================================================
  redis:
    image: redis/redis-stack-server:latest
    container_name: metaorcha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metaorcha-network

  # ============================================================================
  # LocalStack (S3 — host apps use http://localhost:4566; run `make s3-init`)
  # ============================================================================
  localstack:
    image: localstack/localstack:3.8
    container_name: metaorcha-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      PERSISTENCE: "0"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal s3 ls 2>/dev/null || curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - metaorcha-network

  # ============================================================================
  # Ollama (Local embeddings for Planning & Discovery)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: metaorcha-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - metaorcha-network

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local
  localstack_data:
    driver: local
  ollama_data:
    driver: local

networks:
  metaorcha-network:
    driver: bridge
