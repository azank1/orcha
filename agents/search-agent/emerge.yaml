identity:
  id: "did:orcha:agent:search-agent"
  name: "Search Agent"
  version: "1.1.0"
  description: "Generic web search via Google Serper — searches any URL and returns extracted page text. The caller constructs the full query including any site: operators."
  tags: ["search", "web", "google", "docs", "scraping", "mcp", "sse"]

protocol:
  type: "mcp"
  version: "2024-11-05"
  transport:
    type: "sse"
    endpoint: "http://localhost:3007/sse"

health_endpoint: "http://localhost:3007/health"

security:
  transport_layer:
    type: "none"
  auth_strategies: []

payment:
  enabled: false  # MCP agents are free — guard skips them by protocol

# MCP capabilities — harvested via MCP list_tools at registration time.
capabilities:
  tools:
    - name: "search_web"
      description: "Search the web via Google and return extracted text from the top results. Construct the full query yourself, including site: operators for documentation searches (e.g. 'site:python.langchain.com memory management' or 'openai function calling best practices')."
      inputSchema:
        type: object
        properties:
          query:
            type: string
            description: "Full search query string. Include site: operators or any other modifiers as needed."
        required:
          - query
      outputSchema:
        type: object
        properties:
          query:
            type: string
          organic:
            type: array
            items:
              type: object
              required: [title, link, snippet, position]
              properties:
                title:
                  type: string
                link:
                  type: string
                snippet:
                  type: string
                position:
                  type: integer
                date:
                  type: string
                  description: "Present only when Serper includes a publication date"
                sitelinks:
                  type: array
                  description: "Present only when Google shows quick-jump links"
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      link:
                        type: string
          error:
            type: string
            description: "Present only when no results were found"

  resources: []
  prompts: []
