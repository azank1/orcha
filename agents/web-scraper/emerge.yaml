identity:
  id: "did:metaorcha:agent:web-scraper"
  name: "Web Scraper"
  version: "0.2.0"
  description: "Fetches and extracts structured data from web URLs with optional OAuth-based authenticated scraping"
  tags: ["scraping", "web", "data-extraction", "auth", "oauth"]

protocol:
  type: "a2a"
  version: "1.0"
  transport:
    type: "http"
    endpoint: "http://localhost:3004"

health_endpoint: "http://localhost:3004/health"

security:
  transport_layer:
    type: "none"
  auth_strategies: []

payment:
  enabled: true
  base_fee: "0.15"  # $0.15 per invocation — web scraping and content extraction

# A2A skills — harvested from /.well-known/agent.json at registration time;
# listed here for documentation and PnD embedding.
skills:
  - id: "scrape"
    name: "Web Scraping"
    description: "Fetch a URL and extract structured data — title, headings, paragraphs, tables, and links. Returns clean JSON."
    tags: ["scraping", "web", "data-extraction", "html", "beautifulsoup"]
    examples:
      - "Fetch https://example.com and extract the main content"
      - "Scrape the pricing table from https://example.com/pricing"
      - "Get all links from https://example.com"

  - id: "summarize"
    name: "Page Summarization"
    description: "Fetch a URL and produce an LLM-powered summary of the page content. Ideal for articles, blog posts, and documentation."
    tags: ["summarization", "web", "llm", "ai", "content"]
    examples:
      - "Summarize the article at https://example.com/blog/post"
      - "Give me the key points from https://example.com/docs"
      - "TL;DR https://example.com/whitepaper"

  - id: "authenticated_scrape"
    name: "Authenticated Scraping"
    description: "Initiate an OAuth login flow (Google, etc.) and scrape pages that require authentication. Returns an auth URL when login is needed, then fetches with stored credentials."
    tags: ["scraping", "auth", "oauth", "login", "google"]
    examples:
      - "Login to my Google account and scrape my profile"
      - "Sign in and fetch my dashboard at https://app.example.com/dashboard"
      - "Authenticate and scrape my account page"
