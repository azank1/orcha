identity:
  id: "did:orcha:agent:notion-research"
  name: "Notion Research"
  version: "0.2.0"
  description: "Research agent that searches the web, analyses market data, and creates structured research notes in Notion"
  tags: ["notion", "research", "web-search", "market-data", "analysis"]

protocol:
  type: "a2a"
  version: "1.0"
  transport:
    type: "http"
    endpoint: "http://localhost:3006"

health_endpoint: "http://localhost:3006/health"

security:
  transport_layer:
    type: "none"
  auth_strategies: []

payment:
  enabled: true
  base_fee: "0.30"  # $0.30 per invocation — multi-source research and Notion synthesis

# A2A skills — harvested from /.well-known/agent.json at registration time;
# listed here for documentation and PnD embedding.
skills:
  - id: "research_topic"
    name: "Topic Research"
    description: "Search the web for a topic using Tavily, summarise findings via LLM, and return structured research results with sources."
    tags: ["research", "web-search", "summarization", "analysis", "tavily"]
    examples:
      - "Research the latest developments in AI agent orchestration"
      - "Find information about x402 payment protocol for agents"
      - "Research Bitcoin Lightning Network adoption in 2026"

  - id: "create_research_note"
    name: "Create Research Note"
    description: "Create a structured research note in Notion with title, sections, tags, and formatted content. Requires NOTION_API_KEY and a workspace/database ID."
    tags: ["notion", "notes", "documentation", "writing", "knowledge-management"]
    examples:
      - "Create a Notion page titled 'AI Agent Market Analysis' with research findings"
      - "Write a research note about Web3 payment protocols in Notion"
      - "Save my research on DePIN networks to Notion database abc123"

  - id: "market_data"
    name: "Market Data"
    description: "Fetch real-time or historical market data (price, volume, indicators, news) for a stock or crypto symbol."
    tags: ["market", "finance", "data", "crypto", "stocks", "price"]
    examples:
      - "Get the current price of BTC"
      - "Fetch ETH market data for the last 24 hours"
      - "What is the AAPL stock price?"
      - "Get volume data for SOL"
