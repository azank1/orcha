identity:
  id: "did:orcha:agent:ecommerce-automation"
  name: "E-commerce Automation"
  version: "1.0.0"
  description: "Autonomous e-commerce automation agent — manages Shopify product listings (create, publish, delete), publishes to Facebook Pages, and publishes to Instagram Business accounts. Send a natural language task describing what to do."
  tags: ["shopify", "facebook", "instagram", "publishing", "store-management", "social-media", "automation", "ecommerce"]

protocol:
  type: "a2a"
  version: "1.0"
  transport:
    type: "http"
    endpoint: "http://localhost:3009"

health_endpoint: "http://localhost:3009/health"

security:
  transport_layer:
    type: "none"
  auth_strategies:
    - id: "shopify"
      type: "oauth2"
      capability_ids:
        - "shopify_management"
      config:
        flow: "authorization_code"
        authorization_url: "http://localhost:3009/auth/start"
        token_url: "https://shopify.com/admin/oauth/access_token"
        scopes:
          - "read_products"
          - "write_products"
        # This is a Shopify Partner app client_id — a public identifier by
        # OAuth design (unlike client_secret, it is not sensitive and is
        # visible in browser redirect URLs). If you deploy your own Shopify
        # Partner app, replace this with your app's client_id.
        client_id: "18f6edd47e356c3d0cb1e28e7e6486a2"
        redirect_uri: "http://localhost:3009/auth/callback"
        provider_hint: "shopify"
        permanent_token: true
        extra_headers:
          X-Shopify-Store-URL: "SHOPIFY_STORE_URL"

payment:
  enabled: false

# A2A skills — harvested from /.well-known/agent.json at registration time.
skills:
  - id: "shopify_management"
    name: "Shopify Store Management"
    description: "Full CRUD for Shopify products via the Shopify Admin REST API: create, list (optionally filtered by active/draft status), get one, update (title, price, description, SKU, vendor, tags), publish, unpublish, delete one, and bulk-delete by status. IMPORTANT: When creating a product, you MUST include all details (title, price, description, SKU, vendor, tags) in the initial create request. Do NOT split creation and updating into multiple steps."
    tags: ["shopify", "products", "ecommerce", "crud", "inventory", "store", "bulk"]
    examples:
      - "Create a Shopify product called Air Max 2026 priced at $129.99, SKU AM-2026, vendor Nike, description 'Limited edition runner'"
      - "Update Metanova Earbuds: set price to $199.99, SKU META-001, vendor MetaOrcha"
      - "List all active products"
      - "List all draft products"
      - "Publish product ID 12345 on my Shopify store"
      - "Unpublish Metanova Earbuds"
      - "Delete product 67890 from my store"
      - "Delete all draft products"
      - "Bulk delete all products"

  - id: "social_publishing"
    name: "Social Media Publishing"
    description: "Publish posts, images, and captions to Facebook Pages and Instagram Business accounts via the Meta Graph API."
    tags: ["facebook", "instagram", "publishing", "social-media", "marketing", "content"]
    examples:
      - "Post to my Facebook page: 'New Air Max 2026 just dropped!'"
      - "Publish an Instagram post with caption announcing new sneaker inventory"
      - "Post an image to my Facebook page"

  - id: "store_analytics"
    name: "Store Analytics"
    description: "Retrieve engagement metrics: post likes, comments, Instagram media insights, and Facebook page post history."
    tags: ["analytics", "facebook", "instagram", "insights", "engagement", "metrics"]
    examples:
      - "How many likes did my last Facebook post get?"
      - "Get Instagram insights for media ID abc123"
      - "Show me the last 5 posts from my Facebook page"
      - "How many comments does post XYZ have?"
