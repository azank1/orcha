identity:
  id: "did:orcha:agent:lead-gen2"
  name: "Lead Gen Agent"
  version: "1.2.0"
  description: >
    Complete B2B lead generation pipeline: searches Apollo.io / Google Maps for prospects,
    scores against your ICP, enriches emails via Hunter, writes qualified leads to HubSpot,
    Google Sheets, Notion, or Microsoft Excel, and sends personalised outreach via Gmail —
    with human-in-the-loop email review before any emails are sent. Fully multi-tenant:
    each tenant connects their own CRM and Gmail via OAuth; platform pays for Apollo and Hunter.
  tags: ["leads", "b2b", "prospecting", "crm", "sales", "outreach", "apollo", "hubspot",
         "hunter", "gmail", "gsheets", "notion", "excel", "fintech", "saas", "hitl", "multi-tenant"]

protocol:
  type: "a2a"
  version: "1.0"
  transport:
    type: "http"
    endpoint: "http://localhost:4567"

health_endpoint: "http://localhost:4567/health"

security:
  transport_layer:
    type: "none"
  auth_strategies:
    # ── Gmail (send outreach emails from the user's own inbox) ─────────────────
    - id: "strategy_gmail"
      type: "oauth2"
      capability_ids:
        - email_outreach
        - full_pipeline
      config:
        oauth_connect_url: "http://localhost:4567/oauth/gmail/connect"
        flow: "authorization_code"
        oidc_discovery_url: "https://accounts.google.com/.well-known/openid-configuration"
        authorization_url: "https://accounts.google.com/o/oauth2/auth"
        token_url: "https://oauth2.googleapis.com/token"
        scopes:
          - "https://www.googleapis.com/auth/gmail.modify"
          - "https://www.googleapis.com/auth/gmail.compose"
          - "https://www.googleapis.com/auth/gmail.send"
        client_id: "319907548905-c5vs12t4qqt3f4r39v8uuig3m3ih6lvf.apps.googleusercontent.com"
        redirect_uri: "http://localhost:4567/oauth/gmail/callback"
        provider_hint: "google"

    # ── Google Sheets (use a Google Sheet as the lead CRM) ─────────────────────
    - id: "strategy_gsheets"
      type: "oauth2"
      capability_ids:
        - crm_write
        - full_pipeline
      config:
        oauth_connect_url: "http://localhost:4567/oauth/gsheets/connect"
        flow: "authorization_code"
        oidc_discovery_url: "https://accounts.google.com/.well-known/openid-configuration"
        authorization_url: "https://accounts.google.com/o/oauth2/auth"
        token_url: "https://oauth2.googleapis.com/token"
        scopes:
          - "https://www.googleapis.com/auth/spreadsheets"
          - "https://www.googleapis.com/auth/drive.file"
        client_id: "319907548905-c5vs12t4qqt3f4r39v8uuig3m3ih6lvf.apps.googleusercontent.com"
        redirect_uri: "http://localhost:4567/oauth/gsheets/callback"
        provider_hint: "google"

    # ── Notion (use a Notion database as the lead CRM) ─────────────────────────
    - id: "strategy_notion"
      type: "oauth2"
      capability_ids:
        - crm_write
        - full_pipeline
      config:
      
        flow: "authorization_code"
        authorization_url: "https://api.notion.com/v1/oauth/authorize"
        token_url: "https://api.notion.com/v1/oauth/token"
        scopes: []
        client_id: "34dd872b-594c-81ff-b878-0037089e1745"
        redirect_uri: "http://localhost:4567/oauth/notion/callback"
        provider_hint: "notion"

    # ── Microsoft Excel (OneDrive workbook as the lead CRM) ────────────────────
    - id: "strategy_excel"
      type: "oauth2"
      capability_ids:
        - crm_write
        - full_pipeline
      config:
        flow: "authorization_code"
        authorization_url: "https://login.microsoftonline.com/common/oauth2/v2.0/authorize"
        token_url: "https://login.microsoftonline.com/common/oauth2/v2.0/token"
        scopes:
          - "Files.ReadWrite"
          - "offline_access"
          - "User.Read"
        client_id: "0fbdfb69-cd0a-489b-94db-1b171b230c09"
        redirect_uri: "http://localhost:4567/oauth/excel/callback"
        provider_hint: "microsoft"

payment:
  type: "none"

interrupt_support:
  - type: "hitl_approval"
    trigger: "email_outreach"
    description: >
      Before any outreach emails are sent the agent pauses and surfaces all personalised
      email drafts for user review. The user can edit subject or body for each draft and
      must explicitly approve before emails are dispatched.

  - type: "agent_clarification"
    trigger: "crm_write"
    description: >
      When HubSpot credentials are not pre-configured the agent pauses and requests the
      user's HubSpot Private App Token before proceeding with CRM writes.

  - type: "oauth_required"
    trigger: "email_outreach"
    description: >
      When no Gmail token is stored for the tenant the agent pauses and returns an auth_url.
      After the user completes the OAuth flow in the browser the agent resumes automatically —
      the SuperAgent only needs to keep polling tasks/get.

  - type: "oauth_required"
    trigger: "crm_write"
    description: >
      When no Google Sheets / Notion / Excel token is stored for the tenant the agent pauses
      and returns an auth_url. After the user completes the OAuth flow the agent resumes automatically.

skills:
  - id: "lead_search"
    name: "Lead Search"
    description: >
      Search for B2B prospects matching role, industry, geography and company size.
      Auto-detects local (Google Maps) vs global (Apollo.io) mode from the query.
      Returns scored and ranked leads.
    tags: ["leads", "prospecting", "b2b", "search", "apollo", "google-maps", "contacts"]
    examples:
      - "Find 10 fintech CTOs in the US"
      - "Find VP Engineering leads at SaaS companies with 50-200 employees"
      - "Get me a list of Head of Engineering at UK fintech startups"
      - "Find decision makers at Series A SaaS companies in Europe"
      - "Who are the CTOs at payments companies in London"
      - "Find marketing agencies in Lahore Pakistan"

  - id: "lead_enrichment"
    name: "Lead Enrichment"
    description: >
      Enrich existing contacts with verified email addresses via Hunter.io.
      Use this when Apollo did not return an email for a prospect.
    tags: ["enrichment", "email", "hunter", "contacts", "data"]
    examples:
      - "Find the email for John Smith at Stripe"
      - "Enrich this contact list with verified emails"
      - "Get email addresses for these domains"

  - id: "crm_write"
    name: "CRM Write"
    description: >
      Write qualified leads to the tenant's CRM — HubSpot, Google Sheets, Notion, or
      Microsoft Excel. Deduplicates by email, creates or updates contacts.
      Tenant selects their CRM via POST /crm/select; each backend has its own OAuth flow.
      If HubSpot token is missing the agent will pause and request it via HITL clarification.
    tags: ["crm", "hubspot", "gsheets", "notion", "excel", "contacts", "write", "sync"]
    examples:
      - "Add these leads to HubSpot"
      - "Save qualified prospects to our Google Sheet"
      - "Sync leads to Notion after scoring"
      - "Write contacts to Excel in OneDrive"

  - id: "email_outreach"
    name: "Email Outreach with Review"
    description: >
      Compose personalised cold-outreach emails and send them via the tenant's Gmail.
      The agent automatically pauses before sending and shows all draft emails to the user.
      The user can edit subject / body for each draft, then approve to send.
      If no Gmail token is stored the agent pauses and triggers OAuth — no manual resume needed.
    tags: ["email", "outreach", "gmail", "personalized", "b2b", "hitl", "review", "cold-email"]
    examples:
      - "Send personalised outreach emails to qualified leads"
      - "Compose and review email drafts for 10 CTOs before sending"
      - "Write a cold outreach sequence and let me review it first"
      - "Draft personalised emails for each qualified lead and show me before sending"

  - id: "full_pipeline"
    name: "Full B2B Lead Gen Pipeline"
    description: >
      Run the complete pipeline: search → ICP scoring → email enrichment → CRM write
      → personalised Gmail outreach (with user review). One call does everything end-to-end.
      Supports HubSpot, Google Sheets, Notion, and Excel as CRM backends.
    tags: ["pipeline", "leads", "crm", "outreach", "full", "end-to-end", "b2b"]
    examples:
      - "Find me 10 fintech CTOs to contact this week and add them to HubSpot"
      - "Build a prospect list of SaaS VPs in the US, save to CRM and send outreach emails"
      - "Run a full lead gen campaign for Series B fintech companies in London"
      - "Find and enrich 20 engineering leaders at cloud companies, write to CRM and email them"
      - "Full pipeline: find 5 CTOs in Europe, score them, add to HubSpot, draft outreach"
      - "Find marketing agencies in Lahore, write to Google Sheets, send outreach via Gmail"
