<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    CONCEPT 2 — THE PRISM / MOSAIC
    Six distinct agents (triangular facets) composing into one unified hexagon.
    Each segment is a different shade of the blue-cyan spectrum — prismatic light.
    The center is the brightest point: the emergent unity from composition.

    Regular hexagon, point-top, circumradius=22, center=(32,32):
      V0=(32,10)  V1=(51.1,21)  V2=(51.1,43)
      V3=(32,54)  V4=(12.9,43)  V5=(12.9,21)
  -->

  <!-- ── Six triangular facets ── -->
  <!-- T0 (top)         C(32,32) V0(32,10)   V1(51.1,21) -->
  <polygon points="32,32 32,10 51.1,21"         fill="#4A7FFA"/>
  <!-- T1 (upper-right) C(32,32) V1(51.1,21)  V2(51.1,43) -->
  <polygon points="32,32 51.1,21 51.1,43"       fill="#3B6EF8"/>
  <!-- T2 (lower-right) C(32,32) V2(51.1,43)  V3(32,54)   -->
  <polygon points="32,32 51.1,43 32,54"         fill="#2352D4"/>
  <!-- T3 (bottom)      C(32,32) V3(32,54)    V4(12.9,43) -->
  <polygon points="32,32 32,54 12.9,43"         fill="#0A7A9C"/>
  <!-- T4 (lower-left)  C(32,32) V4(12.9,43)  V5(12.9,21) -->
  <polygon points="32,32 12.9,43 12.9,21"       fill="#009BB8"/>
  <!-- T5 (upper-left)  C(32,32) V5(12.9,21)  V0(32,10)   -->
  <polygon points="32,32 12.9,21 32,10"         fill="#00C8E8"/>

  <!-- ── Thin seam lines between facets (give precision / cut-gem look) ── -->
  <g stroke="rgba(7,7,12,0.4)" stroke-width="0.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="32"  y2="10"/>
    <line x1="32" y1="32" x2="51.1" y2="21"/>
    <line x1="32" y1="32" x2="51.1" y2="43"/>
    <line x1="32" y1="32" x2="32"  y2="54"/>
    <line x1="32" y1="32" x2="12.9" y2="43"/>
    <line x1="32" y1="32" x2="12.9" y2="21"/>
  </g>

  <!-- ── Hexagon outer edge (clean boundary) ── -->
  <polygon points="32,10 51.1,21 51.1,43 32,54 12.9,43 12.9,21"
           fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- ── Center glow (the unified emergent point) ── -->
  <circle cx="32" cy="32" r="5"   fill="#AECBFD" opacity="0.6"/>
  <circle cx="32" cy="32" r="2.5" fill="#D0E8FF" opacity="0.9"/>
</svg>
