[project]
name = "emerge-node"
version = "0.1.0"
description = "emerge-node — Ed25519 signed-envelope helpers (charter + attestation crypto)"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=42",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emerge_node"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
