identity:
  id: "did:orcha:system:filesystem"
  name: "Filesystem"
  version: "1.0.0"
  description: "Read and write files within the session's /tmp workspace. Scope-restricted to /tmp — cannot read or write outside this directory. SuperAgent session directories (/tmp/{session_id}/) are the only accessible workspace."
  tags: ["filesystem", "files", "io", "system"]

protocol:
  type: "mcp"
  version: "2024-11-05"
  transport:
    type: "stdio"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

health_endpoint: "http://localhost:0/health"

security:
  transport_layer:
    type: "none"
  auth_strategies: []

payment:
  enabled: false

capabilities:
  tools:
    - name: "read_file"
      description: "Read the complete contents of a file from /tmp."
      inputSchema:
        type: object
        properties:
          path:
            type: string
            description: "Absolute path to file (must be under /tmp)"
        required: ["path"]
    - name: "write_file"
      description: "Write content to a file in /tmp."
      inputSchema:
        type: object
        properties:
          path:
            type: string
            description: "Absolute path to file (must be under /tmp/{session_id}/)"
          content:
            type: string
            description: "File content to write"
        required: ["path", "content"]
    - name: "list_directory"
      description: "List files and directories under a /tmp path."
      inputSchema:
        type: object
        properties:
          path:
            type: string
            description: "Absolute path to directory (must be under /tmp)"
        required: ["path"]
    - name: "create_directory"
      description: "Create a directory under /tmp."
      inputSchema:
        type: object
        properties:
          path:
            type: string
            description: "Absolute path to create (must be under /tmp/{session_id}/)"
        required: ["path"]
    - name: "move_file"
      description: "Move or rename a file within /tmp."
      inputSchema:
        type: object
        properties:
          source:
            type: string
          destination:
            type: string
        required: ["source", "destination"]
    - name: "delete_file"
      description: "Delete a file from /tmp."
      inputSchema:
        type: object
        properties:
          path:
            type: string
            description: "Absolute path to file (must be under /tmp/{session_id}/)"
        required: ["path"]
