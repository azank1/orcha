[project]
name = "common-llm"
version = "0.1.0"
description = "Shared LLM provider abstraction for Orcha services"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "common-utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
