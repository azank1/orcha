[project]
name = "common-kafka"
version = "0.1.0"
description = "Shared Kafka consumer/producer for Orcha services"
requires-python = ">=3.12"

dependencies = [
    "aiokafka>=0.10.0",
    "pydantic>=2.5.0",
    "common-utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
