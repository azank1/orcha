[project]
name = "common-pricing"
version = "0.1.0"
description = "Pure pricing formulae for Orcha — zero operational dependencies"
requires-python = ">=3.12"
dependencies = []   # intentionally empty — no DB, Redis, HTTP, or FastAPI

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_pricing"]
