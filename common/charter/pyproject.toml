[project]
name = "charter"
version = "0.1.0"
description = "AAC (Agentic Authorization Charter) — signed scope charters and monotonic delegation attenuation"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=42",
  "pydantic>=2.5.0",
  "emerge-node",
]

[tool.uv.sources]
emerge-node = {workspace = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../node/src"]
