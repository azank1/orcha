[project]
name = "internal-commons"
version = "0.1.0"
description = "Shared interrupt types and SSE contracts for EmergeOS internal services"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/internal_commons"]
