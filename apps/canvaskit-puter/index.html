<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orcha CanvasKit · Puter</title>
    <!--
      puter.js — client SDK loaded from Puter's CDN. This is a *client library*
      (its own permissive package), NOT the AGPL Puter core. The viewer never
      forks or embeds Puter; it calls the SDK at runtime like any API client.
      If window.puter is unavailable (opened outside Puter), the app falls back
      to a bundled sample manifest — see src/puter.ts.
    -->
    <script src="https://js.puter.com/v2/"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
