identity:
  id: "did:orcha:agent:test-mcp-agent"
  name: "TestMCPAgent"
  version: "1.0.0"
  description: "A test MCP agent for unit testing"
  tags: ["test", "mcp", "automation"]

protocol:
  type: "mcp"
  version: "2025-11-25"
  transport:
    type: "sse"
    endpoint: "http://localhost:9000/agents/mcp"

health_endpoint: "http://localhost:9000/health"

security:
  transport_layer:
    type: "tls"

  auth_strategies:
    - id: "strategy_api_key"
      type: "x_api_key"
      config:
        header_name: "X-Api-Key"
        key_vault_ref: "MY_API_KEY"

payment:
  type: "x402"
  config:
    enabled: true
    chain_id: "ETH_MAINNET"
    recipient_address: "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
    asset: "USDC"
    token_address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    default_price: "50"
    currency: "USDC"
