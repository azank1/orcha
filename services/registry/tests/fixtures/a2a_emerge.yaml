identity:
  id: "did:orcha:agent:test-a2a-agent"
  name: "TestA2AAgent"
  version: "1.0.0"
  description: "A test A2A agent for unit testing"
  tags: ["test", "a2a", "finance"]

protocol:
  type: "a2a"
  version: "1.0"
  transport:
    type: "http"
    endpoint: "http://localhost:9000/agents/a2a"

health_endpoint: "http://localhost:9000/health"

security:
  transport_layer:
    type: "tls"

  auth_strategies:
    - id: "strategy_oauth"
      type: "oauth2"
      config:
        oidc_discovery_url: "https://accounts.google.com/.well-known/openid-configuration"
        scopes: ["profile", "email"]
        provider_hint: "google"

payment:
  type: "none"
