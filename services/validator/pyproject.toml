[project]
name = "validator-service"
version = "0.1.0"
description = "Validator attestation reference implementation"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
  "common-database",
  "emerge-node",
]

[tool.uv.sources]
common-database = {workspace = true}
emerge-node = {workspace = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../superagent/src", "../../node/src"]
