[pytest]
# Test discovery and execution configuration

testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (fast, mocked dependencies, <100ms each)
    integration: Integration tests (may use mocked DB/LLM, 100ms-1s)
    db: Tests requiring real database connection
    slow: Slow tests (>1s)

# Asyncio mode - auto discover and handle async fixtures
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-report=html

# Timeout for tests (seconds)
timeout = 30

# Log settings
log_cli = false
log_cli_level = INFO
