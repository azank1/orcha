<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0B0B0E"/><rect x="120" y="255" width="360" height="165" rx="16" fill="#101014" stroke="#26262F" stroke-width="2"/><text x="300" y="320" font-family="JetBrains Mono" font-size="13" fill="#3ECF8E" text-anchor="middle" letter-spacing="2">GENERATOR</text><text x="300" y="362" font-family="Space Grotesk" font-weight="700" font-size="26" fill="#E8E8EC" text-anchor="middle">the model</text><text x="300" y="394" font-family="JetBrains Mono" font-size="13.5" fill="#8B8B96" text-anchor="middle">produces work, nearly free, forever</text><rect x="780" y="255" width="300" height="165" rx="16" fill="#101014" stroke="#6366F1" stroke-width="2.5"/><text x="930" y="320" font-family="JetBrains Mono" font-size="13" fill="#6366F1" text-anchor="middle" letter-spacing="2">VERIFIER</text><text x="930" y="362" font-family="Space Grotesk" font-weight="700" font-size="26" fill="#E8E8EC" text-anchor="middle">the check</text><text x="930" y="394" font-family="JetBrains Mono" font-size="13.5" fill="#8B8B96" text-anchor="middle">decides ship / retry / stop</text><path d="M 480 300 L 770 300" stroke="#3ECF8E" stroke-width="10" fill="none" opacity="0.85"/><path d="M 770 285 L 795 300 L 770 315" stroke="#3ECF8E" stroke-width="10" fill="none" opacity="0.85"/><path d="M 780 375 L 480 375" stroke="#6366F1" stroke-width="2.5" fill="none" stroke-dasharray="8 7"/><path d="M 490 360 L 465 375 L 490 390" stroke="#6366F1" stroke-width="2.5" fill="none"/><text x="625" y="270" font-family="JetBrains Mono" font-size="14" fill="#3ECF8E" text-anchor="middle">work, at scale</text><text x="625" y="415" font-family="JetBrains Mono" font-size="14" fill="#6366F1" text-anchor="middle">judgment, one gate</text><text x="600" y="90" font-family="JetBrains Mono" font-size="14" fill="#5A5A66" text-anchor="middle" letter-spacing="2">EVERY AGENT LOOP = GENERATOR WIRED TO A VERIFIER</text><text x="600" y="600" font-family="Space Grotesk" font-weight="700" font-size="30" fill="#E8E8EC" text-anchor="middle">the generator was never the bottleneck.</text></svg>