# Orcha Sandbox — hosted demo stack
# Usage: make -f deploy/sandbox/Makefile up
#
# All secrets live in .env.sandbox (copy from .env.sandbox.example and fill in).
# Nothing in this file contains credentials.

x-python-build: &python-build
  context: ../..
  dockerfile: services/registry/Dockerfile   # overridden per-service

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg15
    container_name: sandbox-postgres
    env_file: ../../.env.sandbox
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: metaorcha
    volumes:
      - sandbox_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sandbox-net]

  redis:
    image: redis/redis-stack-server:latest
    container_name: sandbox-redis
    volumes:
      - sandbox_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sandbox-net]

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: sandbox-kafka
    hostname: kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: "SandboxKRaftClusterID0001"
    volumes:
      - sandbox_kafka:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [sandbox-net]

  ollama:
    image: ollama/ollama:latest
    container_name: sandbox-ollama
    volumes:
      - sandbox_ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [sandbox-net]

  localstack:
    image: localstack/localstack:3.8
    container_name: sandbox-localstack
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    volumes:
      - sandbox_localstack:/var/lib/localstack
    networks: [sandbox-net]

  # ── Core Services ────────────────────────────────────────────────────────────

  registry:
    build:
      context: ../..
      dockerfile: services/registry/Dockerfile
    container_name: sandbox-registry
    env_file: ../../.env.sandbox
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/metaorcha
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DISABLE_AUTH: "true"
      PAYMENT_MODE: mock
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [sandbox-net]

  planning-discovery:
    build:
      context: ../..
      dockerfile: services/planning-discovery/Dockerfile
    container_name: sandbox-pnd
    env_file: ../../.env.sandbox
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/metaorcha
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LLM_PROVIDER: openrouter
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_EMBEDDING_PROVIDER: ollama
      LLM_EMBEDDING_MODEL: nomic-embed-text
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      ollama: {condition: service_started}
    networks: [sandbox-net]

  superagent:
    build:
      context: ../..
      dockerfile: services/superagent/Dockerfile
    container_name: sandbox-superagent
    env_file: ../../.env.sandbox
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/metaorcha
      REDIS_URL: redis://redis:6379/0
      PND_SERVICE_URL: http://planning-discovery:8001
      REGISTRY_SERVICE_URL: http://registry:8000
      REGISTRY_INTERNAL_KEY: ${REGISTRY_INTERNAL_KEY:-dev-internal-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VAULT_KEY: ${VAULT_KEY}
      S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      ARTIFACT_S3_BUCKET: emerge-artifacts-local
      PAYMENT_MODE: mock
    depends_on:
      redis: {condition: service_healthy}
      registry: {condition: service_started}
    networks: [sandbox-net]

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    container_name: sandbox-gateway
    env_file: ../../.env.sandbox
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/metaorcha
      REDIS_URL: redis://redis:6379/1
      SUPERAGENT_URL: http://superagent:8002
      REGISTRY_URL: http://registry:8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GATEWAY_INSTANCE_ID: sandbox-gateway-1
      S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      ARTIFACT_S3_BUCKET: emerge-artifacts-local
      PAYMENT_MODE: mock
      SANDBOX_MODE: "true"
      SANDBOX_MAX_DAILY_MESSAGES: ${SANDBOX_MAX_DAILY_MESSAGES:-500}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      superagent: {condition: service_started}
    networks: [sandbox-net]

  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_GATEWAY_URL: /api
        VITE_SANDBOX_MODE: "true"
    container_name: sandbox-frontend
    networks: [sandbox-net]

  # ── Agents ───────────────────────────────────────────────────────────────────

  finance-dashboard:
    build:
      context: ../..
      dockerfile: agents/finance-dashboard-agent/Dockerfile
    container_name: sandbox-finance-dashboard
    networks: [sandbox-net]

  search-agent:
    build:
      context: ../..
      dockerfile: agents/search-agent/Dockerfile
    container_name: sandbox-search-agent
    env_file: ../../.env.sandbox
    environment:
      SERPER_API_KEY: ${SERPER_API_KEY:-}
    networks: [sandbox-net]

  web-scraper:
    build:
      context: ../..
      dockerfile: agents/web-scraper/Dockerfile
    container_name: sandbox-web-scraper
    networks: [sandbox-net]

  lead-gen:
    build:
      context: ../../agents/lead-gen-agent
      dockerfile: Dockerfile
    container_name: sandbox-lead-gen
    env_file: ../../.env.sandbox
    networks: [sandbox-net]

  notion-research:
    build:
      context: ../..
      dockerfile: agents/notion-research/Dockerfile
    container_name: sandbox-notion-research
    env_file: ../../.env.sandbox
    networks: [sandbox-net]

  ecommerce:
    build:
      context: ../../agents/ecommerce-automation
      dockerfile: Dockerfile
    container_name: sandbox-ecommerce
    networks: [sandbox-net]

  gws-orchestrator:
    build:
      context: ../../agents/google-workspace-orchestrator
      dockerfile: Dockerfile
    container_name: sandbox-gws-orchestrator
    env_file: ../../.env.sandbox
    networks: [sandbox-net]

  # ── Reverse Proxy ────────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: sandbox-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - gateway
      - frontend
    networks: [sandbox-net]

volumes:
  sandbox_postgres:
  sandbox_redis:
  sandbox_kafka:
  sandbox_ollama:
  sandbox_localstack:

networks:
  sandbox-net:
    driver: bridge
