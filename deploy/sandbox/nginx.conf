events {
    worker_connections 1024;
}

http {
    # Rate limit zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    limit_req_status 429;

    # Logging
    log_format main '$remote_addr - $request [$time_local] $status';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # Frontend
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
        }

        # Auth endpoints — frontend BASE_URL=/api calls /api/auth/*
        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            rewrite ^/api/auth/(.*) /auth/$1 break;
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API — 10 req/min per IP
        # proxy_pass with trailing "/" makes nginx replace the matched
        # location prefix (/api/) with "/", so the gateway receives the
        # path without the extra /api prefix.
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://gateway:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE — long-lived connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }
    }
}
